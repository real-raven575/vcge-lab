<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Glyph the Owl</title>
  <style>
    .lid { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); animation: blink 7s infinite; }
    .lid.r { animation-delay: .04s; }
    @keyframes blink { 0%, 95%, 100% { transform: scaleY(0); } 97% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .lid { animation: none; } }
  </style>
  <!-- Ear tufts -->
  <path d="M15 17 L11 4 L23 13 Z" fill="#8A93A3"/>
  <path d="M49 17 L53 4 L41 13 Z" fill="#8A93A3"/>
  <path d="M17 14 L14 7 L21 12 Z" fill="#F2B544"/>
  <!-- Body: midnight-navy coat with the high round collar -->
  <path d="M12 40 C12 24 20 13 32 13 C44 13 52 24 52 40 C52 52 43 60 32 60 C21 60 12 52 12 40 Z" fill="#1B2A4A"/>
  <path d="M18 46 C22 52 27 55 32 55 C37 55 42 52 46 46 L46 56 C42 59 37 61 32 61 C27 61 22 59 18 56 Z" fill="#14203A"/>
  <!-- Facial disc (ash grey) -->
  <ellipse cx="32" cy="31" rx="18" ry="14" fill="#B8C0CC"/>
  <!-- Feather quilting on the chest -->
  <path d="M24 47 q2 2 4 0 q2 2 4 0 q2 2 4 0 q2 2 4 0" fill="none" stroke="#2C3E66" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M26 51 q2 2 4 0 q2 2 4 0 q2 2 4 0" fill="none" stroke="#2C3E66" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Brass goggles: two big rings and the bridge -->
  <circle cx="23.5" cy="30" r="9" fill="#F6E7B8" stroke="#C8962E" stroke-width="3"/>
  <circle cx="40.5" cy="30" r="9" fill="#F6E7B8" stroke="#C8962E" stroke-width="3"/>
  <path d="M31 29 h2" stroke="#C8962E" stroke-width="3" stroke-linecap="round"/>
  <!-- Pale-gold eyes -->
  <circle cx="23.5" cy="30" r="5.4" fill="#F2C14E"/>
  <circle cx="40.5" cy="30" r="5.4" fill="#F2C14E"/>
  <circle cx="24.3" cy="30.6" r="2.9" fill="#0E1626"/>
  <circle cx="41.3" cy="30.6" r="2.9" fill="#0E1626"/>
  <circle cx="25.4" cy="29.2" r="1" fill="#FFFFFF"/>
  <circle cx="42.4" cy="29.2" r="1" fill="#FFFFFF"/>
  <!-- Eyelids (blink) -->
  <rect class="lid" x="17.9" y="24.6" width="11.2" height="11" rx="5.5" fill="#8A93A3"/>
  <rect class="lid r" x="34.9" y="24.6" width="11.2" height="11" rx="5.5" fill="#8A93A3"/>
  <!-- Lens glint on the goggles -->
  <path d="M17.5 25.5 a8 8 0 0 1 4 -3.4" fill="none" stroke="#FFF6D8" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M34.5 25.5 a8 8 0 0 1 4 -3.4" fill="none" stroke="#FFF6D8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Beak -->
  <path d="M30 37 L34 37 L32 41.5 Z" fill="#E08A2B"/>
  <!-- The pencil behind the left ear (for pointing, never writing) -->
  <g transform="rotate(-38 50 20)">
    <rect x="44" y="18.5" width="11" height="3" rx="0.6" fill="#F2C744"/>
    <rect x="44" y="18.5" width="2" height="3" fill="#E58AA0"/>
    <path d="M55 18.5 L58 20 L55 21.5 Z" fill="#E9C9A0"/>
    <path d="M57.2 19.6 L58 20 L57.2 20.4 Z" fill="#333"/>
  </g>
</svg>
