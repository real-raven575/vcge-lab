<!doctype html>
<html lang="en">

<title>Team History</title>
<style>
:root { --bg: #EEF1F4; --panel: #fff; --line: #D8DEE6; --ink: #1B2230; --dim: #5A6475; --hazard: #F2B705; --link: #2B5FD9; }
@media (prefers-color-scheme: dark) { :root { --bg: #0D1117; --panel: #161B24; --line: #2A3342; --ink: #E6EAF0; --dim: #9AA4B4; --hazard: #F5C84B; --link: #79A6FF; } }
html { color-scheme: light dark; }
body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
main { max-width: 760px; margin: auto; background: var(--panel); border: 1px solid var(--line); border-top: 5px solid var(--hazard); border-radius: 14px; padding: 18px; }
a { color: var(--link); } p { color: var(--dim); } h1 { margin: 4px 0 8px; }
.bay { font: 700 .75rem/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .18em; color: var(--dim); }
</style>
</head>

<main>
  <p><a href="/">&larr; Flight Deck</a></p>

  <h1>Team History</h1>
